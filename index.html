<script>
"use strict";
const $ = (id) => document.getElementById(id);
const chat = $("chat");
const input = $("input");
const esc = (s) => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const baseName = (p) => (p || "").split("/").filter(Boolean).pop() || "/";

// ================= syntax highlighting =================
const KW = {
  js: "const|let|var|function|return|if|else|for|while|do|class|extends|new|import|export|from|default|try|catch|finally|throw|async|await|typeof|instanceof|in|of|switch|case|break|continue|yield|delete|void|static|get|set|null|undefined|true|false|this|super",
  py: "def|return|if|elif|else|for|while|class|import|from|as|try|except|finally|with|lambda|pass|raise|global|nonlocal|assert|yield|async|await|None|True|False|and|or|not|in|is|self",
  sh: "if|then|else|elif|fi|for|in|do|done|while|case|esac|function|return|exit|local|export|echo|set|source|cd|ls|grep|cat|mkdir|rm|cp|mv|curl|node|npm|git|sudo",
  go: "func|return|if|else|for|range|switch|case|break|continue|type|struct|interface|map|package|import|var|const|go|chan|defer|select|nil|true|false|make|new",
  rs: "fn|return|if|else|for|while|loop|match|struct|enum|impl|trait|use|mod|pub|let|mut|ref|move|async|await|unsafe|where|self|Self|true|false|Some|None|Ok|Err",
  sql: "select|from|where|insert|into|values|update|set|delete|create|table|drop|alter|join|left|right|inner|outer|on|as|and|or|not|null|order|by|group|limit|offset|having|distinct|union|index|primary|key",
  css: "color|background|margin|padding|border|display|position|width|height|font|flex|grid|align|justify|top|left|right|bottom|overflow|opacity|transition|transform|content",
  yaml: "true|false|null|yes|no",
};
const LANG = {
  js:  { kw: KW.js,  com: /\/\/[^\n]*|\/\*[\s\S]*?\*\//, str: /`(?:\\[\s\S]|\$\{[^}]*\}|[^`\\])*`|"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*'/ },
  ts:  { kw: KW.js,  com: /\/\/[^\n]*|\/\*[\s\S]*?\*\//, str: /`(?:\\[\s\S]|\$\{[^}]*\}|[^`\\])*`|"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*'/ },
  py:  { kw: KW.py,  com: /#[^\n]*/, str: /"""[\s\S]*?"""|'''[\s\S]*?'''|"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*'/ },
  sh:  { kw: KW.sh,  com: /#[^\n]*/, str: /"(?:\\.|[^"\\])*"|'[^'\n]*'/ },
  go:  { kw: KW.go,  com: /\/\/[^\n]*|\/\*[\s\S]*?\*\//, str: /`[^`]*`|"(?:\\.|[^"\\\n])*"|'[^'\n]*'/ },
  rs:  { kw: KW.rs,  com: /\/\/[^\n]*|\/\*[\s\S]*?\*\//, str: /"(?:\\.|[^"\\\n])*"|'\\?[a-zA-Z]?'?/ },
  sql: { kw: KW.sql, com: /--[^\n]*/, str: /'([^'\n]|'')*'/ },
  css: { kw: KW.css, com: /\/\*[\s\S]*?\*\//, str: /"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*'/ },
  yaml:{ kw: KW.yaml, com: /#[^\n]*/, str: /"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*'/ },
  json:{ kw: "", com: /$^/, str: /"(?:\\.|[^"\\])*"/ },
};
const ALIAS = { javascript:"js", typescript:"ts", python:"py", bash:"sh", shell:"sh", zsh:"sh",
  rust:"rs", golang:"go", yml:"yaml", htm:"html", xml:"html", plain:"txt", text:"txt", diff:"diff", patch:"diff" };
const EXT_LANG = { js:"js", mjs:"js", cjs:"js", jsx:"js", ts:"ts", tsx:"ts", py:"py", sh:"sh", bash:"sh", zsh:"sh",
  go:"go", rs:"rs", sql:"sql", css:"css", html:"txt", htm:"txt", xml:"txt", svg:"txt", json:"json", yaml:"yaml", yml:"yaml",
  toml:"txt", ini:"txt", env:"txt", md:"txt", txt:"txt", log:"txt", c:"js", h:"js", cpp:"js", hpp:"js", java:"js", rb:"py", csv:"txt", lock:"txt" };

function highlight(code, langRaw) {
  const lang = ALIAS[langRaw] || langRaw || "txt";
  if (lang === "diff") return highlightDiff(code);
  const L = LANG[lang];
  if (!L) return esc(code);
  const parts = [];
  if (L.com.source !== "$^") parts.push([L.com, "tk-com"]);
  parts.push([L.str, "tk-str"]);
  parts.push([/(?:\b0x[\da-fA-F]+\b|\b\d+(?:\.\d+)?(?:e[+-]?\d+)?\b)/i, "tk-num"]);
  if (L.kw) parts.push([new RegExp("\\b(?:" + L.kw + ")\\b"), "tk-kw"]);
  parts.push([/\b[a-zA-Z_][\w]*(?=\s*\()/, "tk-fn"]);
  const master = new RegExp(parts.map((p) => "(" + p[0].source + ")").join("|"), "gm");
  let out = "", last = 0, m;
  while ((m = master.exec(code))) {
    if (m.index > last) out += esc(code.slice(last, m.index));
    let cls = null;
    for (let i = 0; i < parts.length; i++) if (m[i + 1] !== undefined) { cls = parts[i][1]; break; }
    out += cls ? `<span class="${cls}">${esc(m[0])}</span>` : esc(m[0]);
    last = m.index + m[0].length;
    if (m[0].length === 0) master.lastIndex++;
  }
  return out + esc(code.slice(last));
}
function highlightDiff(code) {
  return code.split("\n").map((line) => {
    if (line.startsWith("+")) return `<span class="tk-add">${esc(line)}</span>`;
    if (line.startsWith("-")) return `<span class="tk-del">${esc(line)}</span>`;
    if (line.startsWith("@@")) return `<span class="tk-hunk">${esc(line)}</span>`;
    return esc(line);
  }).join("\n");
}
const langOfPath = (p) => EXT_LANG[(p.split(".").pop() || "").toLowerCase()] || "txt";

// ================= code blocks =================
const codeStore = new Map(); let codeId = 0;
function codeBlockHtml(raw, lang) {
  const id = ++codeId;
  codeStore.set(id, raw);
  return `<div class="codeblock"><div class="cbhead"><span>${esc(lang || "text")}</span>` +
    `<button data-copy="${id}">copy</button></div><pre><code>${highlight(raw, lang)}</code></pre></div>`;
}
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-copy]");
  if (!b) return;
  const raw = codeStore.get(Number(b.dataset.copy));
  if (raw == null) return;
  navigator.clipboard.writeText(raw).then(() => {
    b.textContent = "copied ✓";
    setTimeout(() => (b.textContent = "copy"), 1500);
  });
});

// ================= markdown =================
function md(text) {
  const blocks = [];
  text = String(text).replace(/```([^\n`]*)\n([\s\S]*?)(?:```|$)/g, (_, lang, code) => {
    blocks.push(codeBlockHtml(code.replace(/\n$/, ""), lang.trim()));
    return `\u0000CB${blocks.length - 1}\u0000`;
  });
  let h = esc(text);
  h = h.replace(/^#### (.*)$/gm, "<h4>$1</h4>").replace(/^### (.*)$/gm, "<h3>$1</h3>")
       .replace(/^## (.*)$/gm, "<h2>$1</h2>").replace(/^# (.*)$/gm, "<h1>$1</h1>");
  h = h.replace(/^---+$/gm, "<hr>");
  h = h.replace(/^&gt; (.*)$/gm, "<blockquote>$1</blockquote>");
  h = h.replace(/(^|\n)((?:\|[^\n]+\|\n?)+)/g, (_, pre, tbl) => {
    const rows = tbl.trim().split("\n").filter(r => r.trim());
    if (rows.length < 2) return pre + tbl;
    const cells = (r) => r.replace(/^\||\|$/g, "").split("|").map(c => c.trim());
    let out = pre + "<table>";
    rows.forEach((r, i) => {
      if (i === 1 && /^\|?[\s:|-]+\|?$/.test(r)) return;
      const tag = i === 0 ? "th" : "td";
      out += "<tr>" + cells(r).map(c => `<${tag}>${c}</${tag}>`).join("") + "</tr>";
    });
    return out + "</table>";
  });
  h = h.replace(/(^|\n)((?:[ \t]*[-*] .*(?:\n|$))+)/g, (_, pre, list) =>
    pre + "<ul>" + list.trim().split("\n").map(l => "<li>" + l.replace(/^[ \t]*[-*] /, "") + "</li>").join("") + "</ul>");
  h = h.replace(/(^|\n)((?:[ \t]*\d+\. .*(?:\n|$))+)/g, (_, pre, list) =>
    pre + "<ol>" + list.trim().split("\n").map(l => "<li>" + l.replace(/^[ \t]*\d+\. /, "") + "</li>").join("") + "</ol>");
  h = h.replace(/`([^`\n]+)`/g, "<code>$1</code>")
       .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
       .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<i>$2</i>")
       .replace(/\[([^\]\n]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  const parts = h.split(/\n{2,}/).map(p => {
    p = p.trim();
    if (!p) return "";
    if (/^<(h\d|ul|ol|table|blockquote|hr|pre|div)/.test(p)) return p;
    return "<p>" + p.replace(/\n/g, "<br>") + "</p>";
  });
  h = parts.join("\n");
  h = h.replace(/\u0000CB(\d+)\u0000/g, (_, i) => blocks[Number(i)]);
  return h;
}

// ================= layout helpers =================
function toast(msg, kind) {
  const t = document.createElement("div");
  t.className = "toast " + (kind || "");
  t.textContent = msg;
  $("toasts").appendChild(t);
  setTimeout(() => { t.style.opacity = "0"; t.style.transition = "opacity .3s"; setTimeout(() => t.remove(), 350); }, 3800);
}
function scrollToBottom(force) {
  const w = $("chatwrap");
  const nearBottom = w.scrollHeight - w.scrollTop - w.clientHeight < 60;
  if (force || nearBottom) w.scrollTop = w.scrollHeight;
}
$("chatwrap").addEventListener("scroll", () => {
  const w = $("chatwrap");
  $("jump").classList.toggle("show", w.scrollHeight - w.scrollTop - w.clientHeight > 200);
});
$("jump").onclick = () => ($("chatwrap").scrollTop = $("chatwrap").scrollHeight);

const SPINNER = ["⠋","⠙","⠹","⠸","⠼","⠴","⠦","⠧","⠇","⠏"];
let spinIdx = 0, spinTimer = null;
function setActivity(text, animate = true) {
  const el = $("activity"), at = $("activityText");
  if (spinTimer) { clearInterval(spinTimer); spinTimer = null; $("spin").textContent = ""; }
  if (!text) { el.classList.add("hidden"); return; }
  el.classList.remove("hidden");
  at.textContent = text;
  if (animate) {
    spinTimer = setInterval(() => {
      spinIdx = (spinIdx + 1) % SPINNER.length;
      $("spin").textContent = SPINNER[spinIdx];
    }, 80);
  }
}

// ================= sessions =================
const sessions = new Map();
let activeSid = null, renderedSid = null;
let models = [];
let queueMode = "steer";
const active = () => sessions.get(activeSid);

function makeSession(info) {
  const sess = {
    sid: info.sid, cwd: info.cwd, name: info.name || null,
    es: null, isStreaming: false, piAlive: info.running,
    queue: [], lastUser: null, cmdCache: null, stats: null,
    pendingDialogs: [], bashLog: [], streamBuf: { text: "", think: "" },
  };
  sessions.set(info.sid, sess);
  attachEvents(sess);
  return sess;
}
function attachEvents(sess) {
  if (sess.es) sess.es.close();
  sess.es = new EventSource("/api/events?sid=" + encodeURIComponent(sess.sid));
  sess.es.onmessage = (e) => {
    let rec; try { rec = JSON.parse(e.data); } catch { return; }
    if (sess.sid === activeSid) onEvent(rec);
    else onBackground(sess, rec);
  };
}
function onBackground(sess, rec) {
  if (rec.type === "agent_start") { sess.isStreaming = true; renderTabs(); }
  else if (rec.type === "agent_settled") { sess.isStreaming = false; renderTabs(); }
  else if (rec.type === "pi_exited") { sess.piAlive = false; renderTabs(); }
  else if (rec.type === "message_start" && rec.message?.role === "assistant") sess.streamBuf = { text: "", think: "" };
  else if (rec.type === "message_update") {
    const ev = rec.assistantMessageEvent;
    if (ev?.type === "thinking_delta") sess.streamBuf.think += ev.delta;
    else if (ev?.type === "text_delta") sess.streamBuf.text += ev.delta;
  } else if (rec.type === "message_end" && rec.message?.role === "assistant") sess.streamBuf = { text: "", think: "" };
}
async function send(command, timeoutMs = 60000, sid) {
  const s = sid || activeSid;
  try {
    const res = await fetch("/api/command", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sid: s, command, timeoutMs }),
    });
    let body = null;
    try { body = await res.json(); } catch {}
    return { ok: res.ok, ...(body || {}) };
  } catch (e) {
    return { ok: false, success: false, error: e.message };
  }
}

// ================= tabs =================
function renderTabs() {
  const el = $("tabs");
  el.innerHTML = "";
  for (const s of sessions.values()) {
    const t = document.createElement("div");
    t.className = "tab" + (s.sid === activeSid ? " active" : "") +
      (s.isStreaming ? " working" : (!s.piAlive ? " dead" : ""));
    const dot = document.createElement("span"); dot.className = "dot";
    const nm = document.createElement("span"); nm.className = "tname";
    nm.textContent = s.name || baseName(s.cwd);
    nm.title = (s.name ? s.name + " · " : "") + s.cwd + "  (double-click to rename)";
    const tx = document.createElement("span"); tx.className = "tx"; tx.textContent = "✕";
    tx.title = "Close session";
    t.append(dot, nm, tx);
    t.onclick = () => switchTo(s.sid);
    nm.ondblclick = (e) => { e.stopPropagation(); renameSession(s); };
    tx.onclick = (e) => { e.stopPropagation(); closeTab(s.sid); };
    el.appendChild(t);
  }
  const plus = document.createElement("button");
  plus.id = "tabnew"; plus.textContent = "＋"; plus.title = "New session (choose a folder)";
  plus.onclick = () => openPicker();
  el.appendChild(plus);
  updateTitle();
}
function renameSession(s) {
  const el = $("tabs");
  const idx = [...sessions.keys()].indexOf(s.sid);
  const tabEl = [...el.children].filter(c => c.classList.contains("tab"))[idx];
  const nm = tabEl?.querySelector(".tname");
  if (!nm) return;
  const inp = document.createElement("input");
  inp.className = "rename";
  inp.value = s.name || "";
  inp.placeholder = baseName(s.cwd);
  nm.replaceWith(inp);
  inp.focus(); inp.select();
  let done = false;
  const commit = async () => {
    if (done) return; done = true;
    const name = inp.value.trim();
    if (!name) {
      if (s.name) toast("pi can't clear a name — keeping \u201c" + s.name + "\u201d", "warn");
      renderTabs(); updatePill();
      return;
    }
    const r = await send({ type: "set_session_name", name }, 15000, s.sid);
    if (r.success) s.name = name;
    else toast("rename failed: " + (r.error || ""), "error");
    renderTabs(); updatePill();
  };
  inp.onkeydown = (e) => {
    e.stopPropagation();
    if (e.key === "Enter") { e.preventDefault(); commit(); }
    else if (e.key === "Escape") { done = true; renderTabs(); }
  };
  inp.onblur = () => commit();
  inp.onclick = (e) => e.stopPropagation();
  inp.ondblclick = (e) => e.stopPropagation();
}
async function closeTab(sid) {
  const s = sessions.get(sid);
  if (s?.isStreaming && !confirm("This session is working — close anyway?")) return;
  await fetch("/api/close", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ sid }) });
  if (s) { s.es?.close(); sessions.delete(sid); }
  if (activeSid === sid) {
    const rest = [...sessions.values()];
    if (rest.length) switchTo(rest[0].sid);
    else {
      const info = await fetch("/api/sessions", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" }).then(r => r.json());
      if (info.sid) { makeSession(info); switchTo(info.sid); }
    }
  }
  renderTabs();
}
function updatePill() {
  const s = active();
  const b = $("projBtn");
  b.innerHTML = `▸ ${esc(s ? (s.name ? `${s.name} · ` : "") + baseName(s.cwd) : "…")} <span class="arrow">＋</span>`;
  b.title = s ? (s.cwd + " — click for a new session") : "";
}
function updateTitle() {
  const s = active();
  document.title = s ? ((s.isStreaming ? "⏳ " : "· ") + (s.name || baseName(s.cwd)) + " — pi") : "pi";
}

// ================= switch session =================
function rebuildLiveStream(s) {
  const st = ensureStream();
  if (s.streamBuf.think) {
    st.thinkEl = makeThinkEl(true);
    st.body.appendChild(st.thinkEl);
    st.thinkBuf = s.streamBuf.think;
    st.hasThinking = true;
    st.thinkEl.querySelector(".inner").textContent = st.thinkBuf;
  }
  if (s.streamBuf.text) {
    st.textSeg = document.createElement("div");
    st.body.appendChild(st.textSeg);
    st.textBuf = s.streamBuf.text;
    st.textSeg.innerHTML = md(st.textBuf);
    st.placeholder = false;
  }
  if (!s.streamBuf.text && !s.streamBuf.think) {
    st.body.innerHTML = `<span class="md-placeholder" style="color:var(--dimmer);font-style:italic">…</span>`;
  }
}

async function switchTo(sid) {
  if (sid === activeSid && renderedSid === sid) return;
  activeSid = sid;
  const s = active();
  stream = null;
  hideRetryBar(); hideCtxPop(); hideQPop(); closeSlash();
  renderTabs(); updatePill();
  if (renderedSid !== sid) {
    setActivity("Loading…", false);
    const msgs = await send({ type: "get_messages" }, 20000, sid);
    if (sid !== activeSid) return; // switched away mid-load
    renderAll(msgs.data?.messages || []);
    renderedSid = sid;
    // replay ephemeral per-session state that isn't part of message history
    for (const entry of s.bashLog) if (entry.running) { userMsg(null, entry.cmd); bashBlockDom(entry); }
    for (const req of s.pendingDialogs) buildDialog(req, s);
    if (s.isStreaming) rebuildLiveStream(s);
    renderQueue();
    setActivity(s.isStreaming ? "Working…" : "Ready", !!s.isStreaming);
    scrollToBottom(true);
  }
  refreshState();
  refreshCtx();
  input.focus();
}

// ================= message rendering =================
function contentText(content) {
  if (typeof content === "string") return content;
  if (Array.isArray(content)) return content.filter(b => b.type === "text").map(b => b.text).join("\n");
  return "";
}
function resultText(result) {
  if (result == null) return "";
  if (typeof result === "string") return result;
  if (Array.isArray(result?.content))
    return result.content.map(c => (c.type === "text" ? c.text : JSON.stringify(c, null, 2))).join("\n");
  return JSON.stringify(result, null, 2);
}
function toolArgSummary(name, a) {
  a = a || {};
  switch (name) {
    case "bash": return a.command ? String(a.command).slice(0, 200) : "";
    case "read": case "write": {
      let s = a.path ? String(a.path) : "";
      if (name === "write" && typeof a.content === "string") s += `  (${a.content.split("\n").length} lines)`;
      return s;
    }
    case "edit": return a.path || "";
    case "grep": case "search": case "find": return [a.pattern, a.path].filter(Boolean).join("  ");
    case "glob": return a.pattern || "";
    default: {
      const s = JSON.stringify(a);
      return s === "{}" ? "" : s.slice(0, 160);
    }
  }
}
function toolPath(a) { a = a || {}; return a.path || a.file_path || a.filename || null; }
const toolRows = new Map();

function makeToolRow(tcid, name, args, status) {
  const d = document.createElement("details");
  d.className = "tool " + (status || "running");
  d.dataset.tcid = tcid || "";
  const sum = document.createElement("summary");
  const ico = document.createElement("span");
  ico.className = "ico";
  ico.textContent = status === "done" ? "✓" : status === "err" ? "✗" : "⋯";
  const tn = document.createElement("span"); tn.className = "tname"; tn.textContent = name;
  const ta = document.createElement("span"); ta.className = "targ";
  ta.textContent = toolArgSummary(name, args);
  const p = toolPath(args);
  if (p) {
    ta.classList.add("peekable");
    ta.title = "Click to preview " + p;
    ta.onclick = (e) => { e.stopPropagation(); peekFile(String(p)); };
  }
  sum.append(ico, tn, ta);
  d.appendChild(sum);
  const inner = document.createElement("div"); inner.className = "inner";
  if (args && Object.keys(args).length)
    inner.innerHTML = `<div class="lbl">input</div><pre>${esc(JSON.stringify(args, null, 2))}</pre>`;
  if (p) {
    inner.insertAdjacentHTML("beforeend", `<button class="viewbtn">preview file ↗</button>`);
    inner.querySelector(".viewbtn").onclick = () => peekFile(String(p));
  }
  d.appendChild(inner);
  if (tcid) toolRows.set(tcid, d);
  return d;
}
function attachToolResult(tcid, result, isError) {
  const d = toolRows.get(tcid) || (tcid ? chat.querySelector(`.tool[data-tcid="${CSS.escape(tcid)}"]`) : null);
  if (!d) return;
  d.classList.remove("running");
  d.classList.add(isError ? "err" : "done");
  d.querySelector(".ico").textContent = isError ? "✗" : "✓";
  const inner = d.querySelector(".inner");
  const txt = resultText(result);
  const short = txt.length > 3000 ? txt.slice(0, 3000) + `\n… (${txt.length - 3000} more chars)` : txt;
  inner.insertAdjacentHTML("beforeend",
    `<div class="lbl">${isError ? "error" : "output"}</div><pre>${esc(short)}</pre>`);
}

function userMsg(content, bashCmd) {
  killEmptyState();
  const d = document.createElement("div");
  d.className = "msg user" + (bashCmd ? " bash" : "");
  const text = bashCmd ? "!" + bashCmd : contentText(content);
  const imgs = (!bashCmd && Array.isArray(content)) ? content.filter(b => b.type === "image") : [];
  if (text) d.innerHTML = `<span class="g">❯</span><span class="txt">${esc(text)}</span>`;
  else d.innerHTML = `<span class="g">❯</span>`;
  if (imgs.length) {
    const row = document.createElement("div"); row.className = "uimgs";
    for (const im of imgs) {
      const i = document.createElement("img");
      i.src = `data:${im.mimeType || "image/png"};base64,${im.data}`;
      i.title = im.name || "";
      row.appendChild(i);
    }
    d.appendChild(row);
  }
  chat.appendChild(d);
  return d;
}
function bashBlockDom(entry) {
  killEmptyState();
  const r = document.createElement("div");
  r.className = "bashres";
  r.innerHTML = `<pre></pre><div class="exit"></div>`;
  const pre = r.querySelector("pre"), exit = r.querySelector(".exit");
  pre.textContent = entry.output || "";
  if (entry.running) exit.textContent = "running…";
  else { exit.textContent = entry.exitText || ""; exit.className = "exit " + (entry.exitClass || ""); }
  entry.el = r;
  chat.appendChild(r);
  scrollToBottom();
  return r;
}

function makeThinkEl(open) {
  const d = document.createElement("details");
  d.className = "think";
  d.open = !!open;
  const s = document.createElement("summary");
  s.textContent = open ? "Thinking…" : "thought";
  d.appendChild(s);
  const inner = document.createElement("div"); inner.className = "inner";
  d.appendChild(inner);
  return d;
}
function assistantContainer() {
  killEmptyState();
  const d = document.createElement("div"); d.className = "msg assistant";
  const body = document.createElement("div"); body.className = "md";
  d.appendChild(body);
  chat.appendChild(d);
  return { el: d, body };
}
function renderAssistantFinal(body, content) {
  body.innerHTML = "";
  const textBlocks = (content || []).filter(b => b.type === "text");
  let ti = 0;
  for (const b of (content || [])) {
    if (b.type === "thinking") {
      const t = makeThinkEl(false);
      t.querySelector("summary").textContent = "thought";
      t.querySelector(".inner").textContent = b.redacted ? "(redacted)" : (b.thinking || "");
      body.appendChild(t);
    } else if (b.type === "text") {
      const p = document.createElement("div");
      p.innerHTML = md(textBlocks[ti++]?.text ?? "");
      body.appendChild(p);
    } else if (b.type === "toolCall") {
      let row = toolRows.get(b.id) || null;
      if (!row) row = makeToolRow(b.id, b.name, b.arguments, "done");
      body.appendChild(row);
    }
  }
}
function renderMessage(m) {
  const role = m.role;
  if (role === "user") { userMsg(m.content); return; }
  if (role === "toolResult") { attachToolResult(m.toolCallId, m.result, m.isError); return; }
  if (role === "assistant") {
    const { body } = assistantContainer();
    renderAssistantFinal(body, m.content);
    if (m.usage) trackUsage(m.usage);
    return;
  }
  const d = document.createElement("div"); d.className = "msg sys";
  const t = contentText(m.content);
  d.textContent = t || ("· " + (role || "system"));
  chat.appendChild(d);
}
function renderAll(messages) {
  chat.innerHTML = "";
  toolRows.clear();
  for (const m of messages) renderMessage(m);
  if (!messages.length) showEmptyState();
  scrollToBottom(true);
}
function showEmptyState() {
  const s = active();
  const name = s ? ((s.name ? s.name + " · " : "") + baseName(s.cwd)) : "project";
  const d = document.createElement("div");
  d.className = "empty"; d.id = "emptyState";
  d.innerHTML = `<div class="empty-logo">π</div>
    <div class="empty-title">pi · ${esc(name)}</div>
    <div class="empty-sub">I can read, edit, search and run commands in this folder. Type <code>/</code> for commands, <code>!</code> for raw shell.</div>
    <div class="empty-chips">
      <button data-p="Give me a tour of this project — structure, main files, how to run it.">📁 Tour this project</button>
      <button data-p="Show me the git status and the most recent changes.">🌿 Git status &amp; recent changes</button>
      <button data-p="Find TODOs, FIXMEs and obvious code smells in this repo.">🔍 Find TODOs &amp; code smells</button>
    </div>`;
  d.querySelectorAll("button").forEach(b => b.onclick = () => { input.value = b.dataset.p; autosize(); input.focus(); });
  chat.appendChild(d);
}
function killEmptyState() { $("emptyState")?.remove?.(); }

// ================= usage + context gauge =================
function trackUsage(u) {
  if (!u) return;
  const inT = (u.input || 0) + (u.cacheRead || 0) + (u.cacheWrite || 0);
  const cost = u.cost?.total != null ? `$${u.cost.total < 0.01 ? u.cost.total.toFixed(4) : u.cost.total.toFixed(3)}` : "";
  $("usage").textContent = `↑${inT.toLocaleString()} ↓${(u.output || 0).toLocaleString()} tok ${cost ? "· " + cost : ""}`;
}
async function refreshCtx() {
  const s = active();
  if (!s) return;
  const r = await send({ type: "get_session_stats" }, 20000, s.sid);
  if (!r.success || r.data?.contextUsage == null) return;
  s.stats = r.data;
  const cu = r.data.contextUsage;
  const pct = Math.min(100, cu.percent || 0);
  const fill = $("ctxfill");
  fill.style.width = pct + "%";
  fill.className = "fill" + (pct > 85 ? " hot" : pct > 60 ? " warn" : "");
  $("ctxtext").textContent = `ctx ${pct}%`;
}
function hideCtxPop() { $("ctxpop").classList.remove("show"); }
async function doExportHtml() {
  const s = active(); if (!s) return;
  hideCtxPop();
  const r = await send({ type: "export_html" }, 60000, s.sid);
  if (!r.success) { toast("export failed: " + (r.error || "unknown"), "error"); return; }
  const path = r.data?.path;
  toast("transcript exported" + (path ? " — " + baseName(path) : ""));
  if (!path) return;
  // pi returns a path relative to the session cwd — resolve it like peekFile does
  const abs = path.startsWith("/") ? path : (s.cwd ? s.cwd.replace(/\/$/, "") + "/" + path : path);
  try {
    // fetch the file through the local server and trigger a browser download
    const res = await fetch("/api/file?path=" + encodeURIComponent(abs));
    const d = await res.json();
    if (!res.ok || typeof d.content !== "string") return;
    const blob = new Blob([d.content], { type: "text/html" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = baseName(path) || "pi-session.html";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  } catch { /* the file is on disk either way — download is a bonus */ }
}
$("ctx").onclick = (e) => {
  e.stopPropagation();
  hideQPop();
  const pop = $("ctxpop");
  if (pop.classList.contains("show")) { hideCtxPop(); return; }
  const st = active()?.stats;
  const fmt = (n) => (n || 0).toLocaleString();
  const cu = st?.contextUsage || {};
  pop.innerHTML = `
    <div class="row"><span>context window</span><b>${fmt(cu.tokens)} / ${fmt(cu.contextWindow)} tok (${cu.percent ?? "—"}%)</b></div>
    <div class="row"><span>session tokens (in / out / cache)</span><b>${fmt(st?.tokens?.input)} / ${fmt(st?.tokens?.output)} / ${fmt(st?.tokens?.cacheRead)}</b></div>
    <div class="row"><span>session cost</span><b>$${(st?.cost ?? 0).toFixed(3)}</b></div>
    <div class="row"><span>messages / tool calls</span><b>${st?.totalMessages ?? "—"} / ${st?.toolCalls ?? "—"}</b></div>
    <div class="row"><span>auto-compaction</span><b id="autoCptLabel">${autoCpt ? "on" : "off"}</b></div>
    <div class="actions">
      <button id="doCompact">⟲ Compact now</button>
      <button id="toggleCpt">auto-compaction: ${autoCpt ? "on" : "off"}</button>
      <button id="doExport">⤓ Export HTML</button>
    </div>`;
  pop.classList.add("show");
  pop.querySelector("#doCompact").onclick = () => doCompact();
  pop.querySelector("#toggleCpt").onclick = () => toggleAutoCpt();
  pop.querySelector("#doExport").onclick = () => doExportHtml();
};
let autoCpt = true;
async function doCompact() {
  const s = active(); if (!s) return;
  hideCtxPop();
  setActivity("Compacting context…", true);
  const r = await send({ type: "compact" }, 180000, s.sid);
  setActivity(s.isStreaming ? "Working…" : "Ready", s.isStreaming);
  if (r.success) {
    const d = r.data || {};
    toast(`compacted: ${d.tokensBefore?.toLocaleString()} → ~${(d.estimatedTokensAfter ?? d.tokensAfter ?? 0).toLocaleString()} tokens`);
  } else toast("compact failed: " + (r.error || "unknown"), "error");
  refreshCtx();
}
async function toggleAutoCpt() {
  autoCpt = !autoCpt;
  const r = await send({ type: "set_auto_compaction", enabled: autoCpt }, 15000);
  if (r.success) { toast("auto-compaction " + (autoCpt ? "on" : "off")); hideCtxPop(); }
  else toast("failed: " + (r.error || ""), "error");
}
document.addEventListener("click", (e) => {
  if (!e.target.closest("#ctxpop") && !e.target.closest("#ctx")) hideCtxPop();
  if (!e.target.closest("#qpop") && !e.target.closest("#qmode")) hideQPop();
});

// ================= streaming =================
let stream = null;
function ensureStream() {
  if (stream) return stream;
  const { body } = assistantContainer();
  stream = { body, thinkEl: null, thinkBuf: "", textSeg: null, textBuf: "", renderT: null, placeholder: true, hasThinking: false };
  return stream;
}
function scheduleStreamRender() {
  if (stream.renderT) return;
  stream.renderT = setTimeout(() => {
    stream.renderT = null;
    if (!stream) return;
    if (stream.thinkEl) stream.thinkEl.querySelector(".inner").textContent = stream.thinkBuf;
    if (stream.textSeg) {
      stream.textSeg.innerHTML = md(stream.textBuf);
      stream.placeholder = false;
    }
    // drop the placeholder once real content exists
    stream.body.querySelector(".md-placeholder")?.remove();
    if (!stream.body.hasChildNodes()) {
      stream.body.innerHTML = `<span class="md-placeholder" style="color:var(--dimmer);font-style:italic">…</span>`;
      return;
    }
    scrollToBottom();
  }, 120);
}
function endStream() {
  if (!stream) return;
  if (stream.renderT) { clearTimeout(stream.renderT); stream.renderT = null; }
  stream = null;
}

// ================= extension dialogs =================
function buildDialog(req, sess) {
  killEmptyState();
  const d = document.createElement("div");
  d.className = "dialog";
  const q = document.createElement("div"); q.className = "q"; q.textContent = req.message || req.title || "Question";
  d.appendChild(q);
  if (req.description) {
    const m = document.createElement("div"); m.className = "m"; m.textContent = req.description;
    d.appendChild(m);
  }
  if (req.options?.length) {
    const opts = document.createElement("div"); opts.className = "opts";
    req.options.forEach((o, i) => {
      const b = document.createElement("button");
      b.textContent = o.label || o;
      b.onclick = () => {
        sess.pendingDialogs = sess.pendingDialogs.filter((x) => x !== req);
        d.classList.add("answered");
        const a = document.createElement("div"); a.className = "answer";
        a.textContent = "→ " + b.textContent;
        d.appendChild(a);
        send({ type: "extension_ui_response", id: req.id, response: { selected: o.value ?? o } });
      };
      opts.appendChild(b);
    });
    d.appendChild(opts);
  } else if (req.allowSubmit !== false) {
    const ta = document.createElement("textarea");
    ta.rows = 2; ta.value = req.defaultValue || "";
    const go = document.createElement("button");
    go.textContent = "Submit";
    go.style.cssText = "background:var(--accent);border:1px solid var(--accent);color:#171512;font-weight:600;border-radius:7px;padding:5px 14px;cursor:pointer;font-size:13px";
    go.onclick = () => {
      sess.pendingDialogs = sess.pendingDialogs.filter((x) => x !== req);
      d.classList.add("answered");
      const a = document.createElement("div"); a.className = "answer";
      a.textContent = "→ " + ta.value;
      d.appendChild(a);
      send({ type: "extension_ui_response", id: req.id, response: { text: ta.value } });
    };
    d.append(ta, go);
  }
  chat.appendChild(d);
  scrollToBottom();
}
function renderDialog(req) { buildDialog(req, active()); }

// ================= event dispatch =================
function onEvent(rec) {
  const s = active();
  if (!s) return;
  switch (rec.type) {
    case "agent_start":
      s.isStreaming = true; renderTabs();
      $("stopbtn").classList.add("show");
      break;
    case "agent_end":
      // one low-level run finished; retries/steering/compaction may still follow —
      // agent_settled is the authoritative idle signal (handled separately below)
      setActivity("Finishing up…", true);
      break;
    case "agent_settled":
      s.isStreaming = false; renderTabs();
      $("stopbtn").classList.remove("show");
      setActivity("Ready", false);
      refreshCtx();
      break;
    case "cwd_changed":
      if (s) { s.cwd = rec.cwd; updatePill(); }
      break;
    case "session_info_changed":
      if (s) {
        s.name = rec.name || null;
        renderTabs();
        if (s.sid === activeSid) updatePill();
      }
      break;
    case "message_start":
      if (rec.message?.role === "user") {
        if (s.queue.length) { const [chip] = s.queue.splice(0, 1); chip.remove(); renderQueue(); }
        userMsg(rec.message.content);
        scrollToBottom();
      } else if (rec.message?.role === "assistant") {
        s.streamBuf = { text: "", think: "" };
        ensureStream();
      }
      break;
    case "message_update": {
      const ev = rec.assistantMessageEvent;
      if (ev?.type === "thinking_delta") s.streamBuf.think += ev.delta;
      else if (ev?.type === "text_delta") s.streamBuf.text += ev.delta;
      if (stream) {
        if (ev?.type === "thinking_delta") {
          if (!stream.thinkEl) { stream.thinkEl = makeThinkEl(true); stream.body.appendChild(stream.thinkEl); stream.hasThinking = true; }
          stream.thinkBuf += ev.delta;
          scheduleStreamRender();
        } else if (ev?.type === "text_delta") {
          if (!stream.textSeg) {
            stream.textSeg = document.createElement("div");
            stream.body.appendChild(stream.textSeg);
          }
          stream.textBuf += ev.delta;
          scheduleStreamRender();
        }
      }
      break;
    }
    case "message_end": {
      const m = rec.message;
      if (m?.role === "assistant") {
        s.streamBuf = { text: "", think: "" };
        if (stream) {
          const { body } = stream;
          endStream();
          renderAssistantFinal(body, m.content);
        } else {
          const { body } = assistantContainer();
          renderAssistantFinal(body, m.content);
        }
        if (m.usage) trackUsage(m.usage);
        if (m.stopReason === "error" && m.errorMessage) showRetryBar(m.errorMessage);
        scrollToBottom();
      } else if (m?.role === "toolResult") {
        attachToolResult(m.toolCallId, m.result, m.isError);
        scrollToBottom();
      }
      break;
    }
    case "tool_execution_start": {
      const st = ensureStream();
      st.body.querySelector(".md-placeholder")?.remove();
      const row = makeToolRow(rec.toolCallId, rec.toolName, rec.args, "running");
      st.body.appendChild(row);
      setActivity(`Using ${rec.toolName}…`, true);
      scrollToBottom();
      break;
    }
    case "tool_execution_update":
      break;
    case "tool_execution_end": {
      setActivity("Working…", true);
      scrollToBottom();
      break;
    }
    case "bash_execution_update": {
      const r = s.bash;
      if (r && rec.id === r.id) {
        r.output += (rec.delta || "");
        if (r.el?.isConnected) {
          r.el.querySelector("pre").textContent = r.output;
          r.el.querySelector("pre").scrollTop = 1e9;
        }
        scrollToBottom();
      }
      break;
    }
    case "compaction_start":
      setActivity("Compacting context…", true);
      break;
    case "compaction_end":
      toast("context compacted");
      refreshCtx();
      break;
    case "auto_retry_start":
      setActivity(`auto-retrying (attempt ${rec.attempt ?? "?"}/${rec.maxAttempts ?? "?"})… ${rec.errorMessage || ""}`, true);
      if (active() === s) showRetryBar(rec.errorMessage || "auto-retrying");
      break;
    case "extension_ui_request":
      renderDialog(rec);
      break;
    case "extension_ui_response":
      break;
    case "extension_error":
      toast("extension error: " + (rec.message || rec.error || ""), "error");
      break;
    case "get_commands_response":
      s.cmdCache = (rec.data?.commands || rec.commands || []).map(c => ({
        name: c.name, description: c.description || "", source: (c.source || "pi").toLowerCase(),
      }));
      if (slashOpen) updateSlash();
      break;
    case "get_state_response":
      if (rec.data) applyState(rec.data);
      break;
    case "get_messages_response":
      break;
    case "get_session_stats_response":
      if (rec.data) s.stats = rec.data;
      break;
    case "branch_summary_response":
      break;
    case "pi_exited":
      s.piAlive = false; s.isStreaming = false;
      renderTabs();
      $("stopbtn").classList.remove("show");
      setActivity("pi process exited", false);
      $("banner").style.display = "flex";
      $("bannerText").textContent = `pi exited (${rec.code ?? "unknown"}) for ${baseName(s.cwd)}`;
      break;
  }
}

// ================= bash mode =================
async function runBash(cmdStr) {
  const s = active(); if (!s) return;
  if (!s.piAlive) { toast("pi process is down — restart first", "warn"); return; }
  userMsg(null, cmdStr);
  const entry = { id: "b" + Date.now(), cmd: cmdStr, output: "", running: true, exitText: "", exitClass: "", el: null };
  s.bashLog.push(entry);
  if (s.bashLog.length > 20) s.bashLog.shift();
  s.bash = entry;
  bashBlockDom(entry);
  setActivity(`Running: ${cmdStr.slice(0, 60)}…`, true);
  send({ type: "bash", command: cmdStr, id: entry.id }, 600000, s.sid).then((rec) => {
    if (s.bash?.id !== entry.id) return;
    s.bash = null;
    entry.running = false;
    if (rec.success) {
      const out = rec.data || {};
      const final = typeof out.output === "string" ? out.output : JSON.stringify(out, null, 2);
      entry.output = final || "(no output)";
      const code = out.exitCode ?? 0;
      entry.exitText = `exit ${code}${out.truncated ? " · truncated" : ""}${out.cancelled ? " · cancelled" : ""}`;
      entry.exitClass = code === 0 ? "ok" : "bad";
    } else {
      entry.exitText = "error: " + (rec.error || "unknown");
      entry.exitClass = "bad";
    }
    if (entry.el?.isConnected) {
      entry.el.querySelector("pre").textContent = entry.output;
      const exit = entry.el.querySelector(".exit");
      exit.textContent = entry.exitText;
      exit.className = "exit " + entry.exitClass;
    }
    if (s.sid === activeSid) setActivity(s.isStreaming ? "Working…" : "Ready", s.isStreaming);
    scrollToBottom(true);
  });
}

async function getCommands(s) {

  s.cmdCache = (r.data?.commands || r.commands || []).map(c => ({

  }));

function updateSlash() {

// ================= send =================
let attachments = [];
function autosize() {
  input.style.height = "auto";
  input.style.height = Math.min(200, input.scrollHeight) + "px";
}
input.addEventListener("input", () => { autosize(); updateSlash(); });
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    if (slashOpen && slashItems.length) { e.preventDefault(); applySlash(slashItems[slashIdx].name); return; }
    e.preventDefault(); doSend(input.value, false);
  } else if (e.key === "Escape") {
    if (slashOpen) { e.preventDefault(); closeSlash(); return; }
    const s = active();
    if (s?.isStreaming) send({ type: "abort" });
  } else if (slashOpen) {
    if (e.key === "ArrowDown") { e.preventDefault(); slashIdx = Math.min(slashIdx + 1, slashItems.length - 1); updateSlash(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); slashIdx = Math.max(slashIdx - 1, 0); updateSlash(); }
    else if (e.key === "Tab") { e.preventDefault(); applySlash(slashItems[slashIdx]?.name); }
  }
});
$("stopbtn").onclick = () => { const s = active(); if (s?.isStreaming) send({ type: "abort" }); };

async function doSend(raw, isRetry = false) {
  const s = active();
  if (!s) return false;
  const text = raw.trim();
  if (!text) return false;

  if (text.startsWith("!")) {
    const cmdStr = text.slice(1).trim();
    if (!cmdStr) return false;
    input.value = ""; autosize(); closeSlash();
    await runBash(cmdStr);
    return true;
  }

  // pi's prompt command takes a plain string message; images go in a separate `images` field
  let msg = text;
  const images = [];
  for (const a of attachments) {
    if (a.kind === "image") images.push({ type: "image", data: a.data, mimeType: a.mimeType });
    else msg = (msg ? msg + "\n\n" : "") + `--- attached file: ${a.name} ---\n${a.text}\n--- end of ${a.name} ---`;
  }
  if (isRetry && Array.isArray(s.lastImages) && s.lastImages.length) {
    for (const im of s.lastImages) images.push(im);
  }

  if (!s.piAlive) { toast("pi process is down — restart first", "warn"); return false; }

  // hard block: don't send images to a model that can't see them
  if (images.length && !modelAcceptsImages(activeModel())) {
    const vision = models.find(x => Array.isArray(x.input) && x.input.includes("image"));
    toast(`${activeModel().name || activeModel().id} can't see images — switch to a vision model${vision ? ` (e.g. ${vision.name || vision.id})` : ""} or remove the images`, "error");
    return false; // input and attachments are kept so the user can switch models and re-send
  }

  input.value = ""; autosize(); closeSlash();
  s.lastUser = msg;
  s.lastImages = images;
  clearAttachments();

  const cmd = { type: "prompt", message: msg };
  if (images.length) cmd.images = images;
  let queued = false;
  if (s.isStreaming && !isRetry) {
    cmd.streamingBehavior = queueMode;
    queued = true;
  }
  const r = await send(cmd, 120000, s.sid);
  if (!r.success) {
    toast((queued ? "queue" : "send") + " failed: " + (r.error || "unknown"), "error");
    userMsg(msg); // local echo so it's visible
    input.value = text; autosize();
    return false;
  }
  if (queued) {
    const chip = document.createElement("span");
    chip.className = "qchip";
    const modeLbl = queueMode === "steer" ? "steer" : "queue";
    chip.innerHTML = `<span class="qmode">${modeLbl}</span><span class="qtxt">${esc(String(text).slice(0, 80))}</span>`;
    s.queue.push(chip);
    renderQueue();
    setActivity(s.isStreaming ? "Working… (message queued)" : "Ready", s.isStreaming);
  }
  return true;
}

// ================= attachments =================
const IMG_TYPES = ["image/png", "image/jpeg", "image/gif", "image/webp"];
const TEXT_EXT = /\.(md|markdown|txt|text|log|json|ya?ml|toml|ini|env|csv|tsv|js|mjs|cjs|jsx|ts|tsx|py|sh|bash|zsh|fish|rb|go|rs|java|kt|c|h|cpp|hpp|cs|html|css|scss|xml|sql|graphql|proto|dockerfile|makefile|gitignore|editorconfig)\.?\w*$/i;
const MAX_IMAGE = 10 * 1024 * 1024;
const MAX_TEXT = 100 * 1024;

function renderAttachments() {
  const row = $("attachrow");
  row.innerHTML = "";
  attachments.forEach((a, i) => {
    const c = document.createElement("span");
    c.className = "chip";
    if (a.kind === "image") c.innerHTML = `<img src="${a.dataUrl}"><span class="cname">${esc(a.name)}</span>`;
    else c.innerHTML = `<span class="fico">📄</span><span class="cname">${esc(a.name)} <small style="color:var(--dimmer)">(${(a.size/1024).toFixed(1)}KB)</small></span>`;
    const x = document.createElement("span");
    x.className = "x"; x.textContent = "✕";
    x.onclick = () => { attachments.splice(i, 1); renderAttachments(); };
    c.appendChild(x);
    row.appendChild(c);
  });
  row.style.display = attachments.length ? "flex" : "none";
}
function clearAttachments() { attachments = []; renderAttachments(); }

function addFile(f) {
  if (f.size > MAX_IMAGE) { toast(`too big: ${f.name} (${(f.size/1048576).toFixed(1)}MB)`, "warn"); return; }
  const isImage = IMG_TYPES.includes(f.type);
  if (isImage && !attachments.some(a => a.kind === "image") && !modelAcceptsImages(activeModel()))
    toast(`heads-up: ${activeModel().name || activeModel().id} can't see images — switching models before sending`, "warn");
  const looksText = !isImage && (f.type.startsWith("text/") || f.type === "" || TEXT_EXT.test(f.name));
  if (!isImage && !looksText) { toast(`skipped: ${f.name} (unsupported type)`, "warn"); return; }
  const reader = new FileReader();
  if (isImage) {
    reader.onload = () => {
      attachments.push({ kind: "image", name: f.name, mimeType: f.type,
        data: String(reader.result).split(",")[1], size: f.size, dataUrl: reader.result });
      renderAttachments();
    };
    reader.readAsDataURL(f);
  } else {
    if (f.size > MAX_TEXT) { toast(`${f.name} too large to inline (>${MAX_TEXT/1024}KB)`, "warn"); return; }
    reader.onload = () => {
      attachments.push({ kind: "text", name: f.name, text: String(reader.result), size: f.size });
      renderAttachments();
    };
    reader.readAsText(f);
  }
}
$("attachBtn").onclick = () => $("filePick").click();
$("filePick").onchange = (e) => { for (const f of e.target.files) addFile(f); e.target.value = ""; };
document.addEventListener("paste", (e) => {
  for (const it of e.clipboardData?.items || []) {
    if (it.type.startsWith("image/")) { const f = it.getAsFile(); if (f) addFile(f); }
  }
});
let dragDepth = 0;
document.addEventListener("dragenter", (e) => {
  if ([...e.dataTransfer?.types || []].includes("Files")) {
    e.preventDefault(); dragDepth++; $("dropzone").classList.add("show");
  }
});
document.addEventListener("dragover", (e) => { if (dragDepth) e.preventDefault(); });
document.addEventListener("dragleave", (e) => {
  if (dragDepth) { e.preventDefault(); if (--dragDepth === 0) $("dropzone").classList.remove("show"); }
});
document.addEventListener("drop", (e) => {
  if (dragDepth) {
    e.preventDefault(); dragDepth = 0; $("dropzone").classList.remove("show");
    for (const f of e.dataTransfer?.files || []) addFile(f);
  }
});

const THINKING_LEVELS = [["off", "no thinking"], ["minimal", "minimal"], ["low", "low"], ["medium", "medium"], ["high", "high"], ["xhigh", "xhigh"], ["max", "max"]];

async function loadModels() {

  $("banner").style.display = "none";
  toast("restarting pi…", "warn");
  const r = await fetch("/api/restart", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ sid: s.sid }) });
  if (r.ok) {
    s.piAlive = true;
    renderedSid = null; // force re-render
    attachEvents(s);
    renderTabs();
    await switchTo(s.sid);
    toast("pi restarted");
  } else toast("restart failed", "error");
};

// ================= init =================
async function init() {
  try { homePath = (await fetch("/api/info").then(r => r.json())).home || homePath; } catch {}
  syncThinkingOptions(null); // full list until a model is known
  const r = await fetch("/api/sessions");
  let list = await r.json();
  if (!list.length) {
    const cr = await fetch("/api/sessions", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
    list = [await cr.json()];
  }
  for (const info of list) makeSession(info);
  await switchTo(list[0].sid);
  loadModels();
  input.focus();
}
init();
</script>
